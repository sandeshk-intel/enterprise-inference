# =============================================================================
# vLLM XPU runtime — low-level plumbing (Intel Arc Pro B-Series XPU)
# =============================================================================
# vLLM on Intel GPUs, as a runtime separate from the CPU `vllm` one: the XPU
# build ships as its own image, runs as a plain InferenceService (one pod per
# model, tensor-parallel across the pod's GPUs) and needs GPU-specific env, so
# it shares nothing with the CPU LLMInferenceService path but the engine.
#
# Deploy config (env, per-category args/defaults) lives in models.yaml →
# runtimes.vllm-xpu; this file holds only the plumbing merged in at load time
# (models.yaml wins on any key clash). Flat runtime — no version axis — so
# `image:` below is the single image every model runs; --server-version aborts.
#
# Supported plumbing keys: see model_manager/runtimes/openvino/values.yaml.
# device: gpu additionally skips the AMX node-affinity requirement (it targets
# CPU serving) and the CPU-pinning policy defaults to best-effort: the pod's
# accelerators, not its handful of host CPUs, are what need scheduling.
# =============================================================================

image: "vllm/vllm-openai-xpu:v0.33.0"   # Intel XPU build of vLLM
device: gpu
kind: InferenceService
format: vllm-xpu
runtime_name: vllm-xpu-runtime                              # ClusterServingRuntime to reference
routing: aigateway
serving_runtime_manifest: vllm-xpu/serving-runtime.yaml     # raw CR manifest applied on first deploy

# Extended resource the Intel GPU device plugin advertises for Arc Pro B-Series
# cards; requested in the container's resources.limits, quantity = `gpu:` (the
# model's tensor-parallel size — one accelerator per TP rank).
accelerator_resource: "gpu.intel.com/xe"
