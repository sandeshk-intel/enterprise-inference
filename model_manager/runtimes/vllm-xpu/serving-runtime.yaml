apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: vllm-xpu-runtime
  labels:
    app.kubernetes.io/managed-by: model-manager
spec:
  annotations:
    prometheus.kserve.io/port: "8000"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: vllm-xpu
      autoSelect: true
      priority: 1
      version: "1"
  protocolVersions:
    - v1
  containers:
    - name: kserve-container
      # {{RUNTIME_IMAGE}} is filled from the runtime's `image:` (runtimes/vllm-xpu/
      # values.yaml, flat — vLLM on XPU has no version axis).
      image: {{RUNTIME_IMAGE}}
      command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
      args: []
      ports:
        - containerPort: 8000
          name: http
          protocol: TCP
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          cpu: "4"
          memory: 8Gi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL
