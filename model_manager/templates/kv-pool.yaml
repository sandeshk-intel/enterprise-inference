apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{NAME}}
    app.kubernetes.io/part-of: {{MODEL_NAME}}
    app.kubernetes.io/managed-by: model-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{NAME}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{NAME}}
        app.kubernetes.io/part-of: {{MODEL_NAME}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - {{NODE}}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pool
          image: {{IMAGE}}
          command: ["/usr/local/bin/kvshrink-entrypoint.sh"]
          args: {{ARGS}}
          env: {{ENV}}
          resources:
            requests:
              cpu: "{{CPU}}"
              memory: {{MEMORY}}{{RESOURCES}}
            limits:
              cpu: "{{CPU}}"
              memory: {{MEMORY}}{{RESOURCES}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: {{RUN_AS}}
            runAsGroup: {{RUN_AS}}
            seccompProfile:
              type: RuntimeDefault
